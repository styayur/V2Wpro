name: Verify and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/morph-evaluate.js --world canopy --soak-seconds 300 --out playtest/endurance
      - uses: actions/upload-artifact@v7
        with:
          name: endurance
          path: |
            playtest/endurance/report.json
            playtest/endurance/*.png
            playtest/endurance/recordings
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: python -m pip install imageio-ffmpeg==0.8.1
      - shell: bash
        run: echo "FFMPEG=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: node tools/licenses.js && npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run evaluate
      - run: node tools/morph-evaluate.js --out playtest/morph
      - uses: actions/upload-artifact@v7
        with:
          name: browser-evaluation
          path: |
            playtest/*.png
            playtest/report.json
            playtest/recordings
            playtest/morph/*.png
            playtest/morph/report.json
            playtest/morph/recordings
      - run: npm run build
      - run: node tools/stamp-site.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [verify, compatibility, endurance]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
