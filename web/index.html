<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>V2Wpro · World studies</title>
    <link rel="icon" href="./logo.svg" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="./"><img src="./logo.svg" alt="" />V2Wpro</a
      ><a href="https://github.com/styayur/V2Wpro">Source ↗</a>
    </header>
    <main>
      <section class="title">
        <div>
          <small id="version">WORLD STUDIES</small>
          <h1 id="title">World studies</h1>
        </div>
        <form id="selection">
          <label
            >World
            <select id="world">
              <optgroup label="Spatial worlds">
                <option value="canopy">Canopy</option>
                <option value="caldera">Caldera</option>
                <option value="lattice">Lattice</option>
              </optgroup>
              <optgroup label="Corridor studies">
                <option value="arcade">Architectural Flight</option>
                <option value="island">Floating Archipelago</option>
                <option value="gate">Motion Playground</option>
              </optgroup>
            </select></label
          ><label
            >Seed
            <input
              id="seed"
              type="number"
              min="0"
              max="4294967295"
              step="1"
              required /></label
          ><button>Apply seed</button>
        </form>
      </section>
      <div id="stage">
        <canvas tabindex="0" aria-label="Playable world"></canvas
        ><output id="hud">Loading world…</output>
      </div>
      <div id="controls">
        <span id="instructions"></span>
        <div id="buttons"></div>
      </div>
      <section id="reference" hidden>
        <video controls muted playsinline preload="metadata"></video>
        <div>
          <h2 id="filmTitle"></h2>
          <p id="filmNotes"></p>
        </div>
      </section>
      <section class="notes">
        <div>
          <h2>References</h2>
          <div id="sources"></div>
        </div>
        <div>
          <h2>Generation rules</h2>
          <p id="summary"></p>
          <details>
            <summary>Inspect rules</summary>
            <pre id="rules"></pre>
          </details>
          <p><a id="document">Open WorldIR ↗</a></p>
        </div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
